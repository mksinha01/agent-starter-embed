version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceai-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - voiceai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voiceai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - voiceai-network

networks:
  voiceai-network:
    driver: bridge
